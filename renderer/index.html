<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
  <title>Praxisbildschirm</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" class="bg theme-light">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grain"></div>
  </div>

  <header id="header">
    <div class="brand">
      <img src="assets/logo.png" alt="" class="brand-logo">
      <div class="brand-text">
        <div class="brand-name" id="brandName">Praxis Dr. Florian Rasche</div>
        <div class="brand-sub" id="brandSub">Hausarzt in Würzburg</div>
      </div>
    </div>
    <div class="clock">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate"></div>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </header>

  <main id="stage"></main>

  <footer id="ticker">
    <div class="ticker-icon">i</div>
    <div class="ticker-clip"><div class="ticker-text" id="tickerText"></div></div>
  </footer>

  <div id="errorBox" hidden></div>

  <script src="app.js"></script>
</body>
</html>
